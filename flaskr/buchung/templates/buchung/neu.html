{% extends "layout.html" %}

{% block content %}

<div class="row g-3">

    <!-- Linke Spalte: Gastsuche -->
    <div class="col-md-4">
        <h5>Gast suchen</h5>
        <input type="text"
               name="q"
               class="form-control"
               placeholder="Anfangsbuchstaben Name..."
               hx-get="{{ url_for('buchung_bp.neu_suche') }}"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#gast-ergebnis"
               autocomplete="off">
        <p class="mt-1 text-muted small">
            Mind. 3 Zeichen. <code>*</code> als Wildcard. <code>Müll* Ral*</code> = Name + Vorname.
        </p>
        <div id="gast-ergebnis"></div>
    </div>

    <!-- Rechte Spalte: Buchungsformular -->
    <div class="col-md-8">
        <div id="buchung-panel">
            {% if besucher and form %}
                {% include 'buchung/neu_formular_partial.html' %}
            {% else %}
                <p class="text-muted">← Gast auswählen, um Buchungsformular zu laden.</p>
            {% endif %}
        </div>
    </div>

</div>

{% endblock %}
