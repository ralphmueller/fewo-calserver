<div class="card mt-3" id="convert-panel-inner">
    <div class="card-header d-flex justify-content-between align-items-center">
        <strong>Angebot umwandeln — Buchungsbestätigung bearbeiten</strong>
        <span class="text-muted small">
            {{ buchung.apartment.name }},
            {{ buchung.anreise | euro_date_short }} – {{ buchung.abreise | euro_date_short }},
            {{ (buchung.abreise - buchung.anreise).days }} Nächte,
            {{ buchung.summe | euro_currency }}
        </span>
    </div>
    <div class="card-body">
        <form hx-post="{{ url_for('buchung_bp.convert_angebot', buchung_id=buchung.id) }}"
              hx-target="#convert-panel"
              hx-swap="innerHTML"
              hx-on::before-request="var inst=CKEDITOR.instances['email_text_convert_{{ buchung.id }}']; if(inst) inst.updateElement();">
            <textarea id="email_text_convert_{{ buchung.id }}" name="email_text"
                      class="form-control" rows="20">{{ email_text }}</textarea>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Bestätigung senden &amp; Buchung speichern →</button>
                <button type="button" class="btn btn-outline-secondary"
                        onclick="document.getElementById('convert-panel').innerHTML=''">Abbrechen</button>
            </div>
        </form>
    </div>
</div>
<script>
    (function() {
        var edId = 'email_text_convert_{{ buchung.id }}';
        if (CKEDITOR.instances[edId]) {
            CKEDITOR.instances[edId].destroy();
        }
        CKEDITOR.replace(edId);
    })();
</script>
