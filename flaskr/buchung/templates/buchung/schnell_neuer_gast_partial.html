<div class="card border-secondary">
    <div class="card-header">Neuen Gast anlegen</div>
    <div class="card-body">
        <form hx-post="{{ url_for('buchung_bp.schnell_neuer_gast') }}"
              hx-target="#buchung-panel"
              hx-swap="innerHTML">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="anreise" value="{{ anreise }}">
            <input type="hidden" name="abreise" value="{{ abreise }}">
            <input type="hidden" name="apartment_id" value="{{ apartment_id }}">

            <div class="row g-2">
                <div class="col-md-3">
                    <select name="anrede" class="form-select form-select-sm">
                        <option value="Fam">Fam</option>
                        <option value="Herr">Herr</option>
                        <option value="Frau">Frau</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="text" name="name" class="form-control form-control-sm"
                           placeholder="Nachname" required>
                </div>
                <div class="col-md-5">
                    <input type="text" name="vorname" class="form-control form-control-sm"
                           placeholder="Vorname" required>
                </div>
            </div>
            <div class="row g-2 mt-1">
                <div class="col-md-7">
                    <input type="email" name="email" class="form-control form-control-sm"
                           placeholder="E-Mail">
                </div>
                <div class="col-md-5">
                    <input type="text" name="land" class="form-control form-control-sm"
                           value="DE" placeholder="Land (DE, AT, …)">
                </div>
            </div>
            <div class="mt-2">
                <button type="submit" class="btn btn-sm btn-primary">Anlegen & weiter</button>
            </div>
        </form>
    </div>
</div>
