{% extends "layout.html" %}

{% block content %}
<div class="container-fluid mt-3">

    {% include 'buchung/detail_partial.html' %}

    <div id="convert-panel"></div>

    {% if buchung.status == 'abgerechnet' %}
    <div class="card mt-3">
        <div class="card-header">Feratel Meldeschein</div>
        <div class="card-body d-flex align-items-center gap-3">
            {% if buchung.meldeschein_nummer %}
            <span class="text-success">Nr. {{ buchung.meldeschein_nummer }}</span>
            {% endif %}
            <form method="post"
                  action="{{ url_for('buchung_bp.feratel_meldeschein', buchung_id=buchung.id) }}"
                  onsubmit="this.querySelector('button').disabled=true; this.querySelector('button').textContent='Wird gemeldet…'">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-sm btn-primary">
                    {% if buchung.meldeschein_nummer %}Erneut melden{% else %}An Feratel melden{% endif %}
                </button>
            </form>
        </div>
    </div>
    {% endif %}

</div>
{% endblock %}
