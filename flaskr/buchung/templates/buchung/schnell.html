{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-12">

        <form hx-get="{{ url_for('buchung_bp.schnell_verfuegbar') }}"
              hx-target="#verfuegbar-panel"
              hx-swap="innerHTML"
              hx-indicator="#spinner">
            <div class="row g-2 align-items-end">
                <div class="col-auto">
                    <label class="form-label mb-1">Anreise</label>
                    <input type="date" name="anreise" class="form-control" required>
                </div>
                <div class="col-auto">
                    <label class="form-label mb-1">Abreise</label>
                    <input type="date" name="abreise" class="form-control" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Verfügbare Wohnungen prüfen</button>
                    <span id="spinner" class="htmx-indicator ms-2 text-muted small">Prüfe…</span>
                </div>
            </div>
        </form>

        <div id="verfuegbar-panel" class="mt-3"></div>

    </div>
</div>
{% endblock %}
