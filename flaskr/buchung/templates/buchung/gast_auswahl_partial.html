<table class="table table-sm table-hover mt-2">
    <thead>
        <tr><th>Name</th><th>Stadt</th><th>Email</th></tr>
    </thead>
    <tbody>
        {% for besucher in data %}
        <tr style="cursor:pointer"
            hx-get="{{ url_for('buchung_bp.neu_formular', besucher_id=besucher.id) }}"
            hx-target="#buchung-panel"
            hx-swap="innerHTML"
            hx-on:click="document.querySelectorAll('#gast-ergebnis tr.table-active').forEach(el=>el.classList.remove('table-active')); this.classList.add('table-active')">
            <td>{{ besucher.name }}, {{ besucher.vorname }}</td>
            <td>{{ besucher.stadt }}</td>
            <td>{{ besucher.email }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-muted">Keine Besucher gefunden</td></tr>
        {% endfor %}
    </tbody>
</table>
