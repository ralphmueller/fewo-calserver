<!DOCTYPE html>
<html lang="de">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/static/node_modules/bootstrap/dist/css/bootstrap.css">
	<link rel="stylesheet" href="/static/css/myapp.css">	
	<link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
	<script src="/static/node_modules/jquery/dist/jquery.js"></script>
	<script src="/static/node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
	<script src="/static/node_modules/chart.js/dist/Chart.js"></script>
	<script src="/static/js/chart_functions.js"></script>
	
    <title>FewoApp Extensions</title>
</head>
<body>
	<div class="container container-fluid">
		{% include 'nav.html' %}
	</div>
	
	<!-- Seiteninhalt -->	
	<div class="container container-fluid">
		<div class="row g-3">
			<div class="col-md-2">
				<!-- left column -->
				{% include 'context-menu.html' %}
			</div>

			<div class="col-md-10">
				<h3>{{title}}</h3>
				<div id="content">{% block content %}{% endblock %}</div>
			</div>
		</div>
	</div> <!-- container Seiteninhalt-->

	<!-- Footer -->	
	<div class="container container-fluid">
		<div class="row">
			<h3>Blueprint Info</h3>
			<ul class="page-properties">
			  <li><span class="attribute-title">Blueprint:</span> <span class="attribute-value">{{ request.blueprint }}</span></li>
			  <li><span class="attribute-title">Template:</span> <span class="attribute-value">{{ self._TemplateReference__context.name }}</span></li>
			  <li><span class="attribute-title">View:</span> <span class="attribute-value">{{ request.endpoint }}</span></li>
			  <li><span class="attribute-title">Route:</span> <span class="attribute-value">{{ request.path }}</span></li>
			</ul>
		  </div>
	</div> <!-- container Footer-->
	
</body>
</html>
