{% extends 'layout.html' %}

{% from "_macros.html" import render_field %}

{% block content %}

<form method="post" action="{{ url_for('auth_bp.change_password') }}">

  {{ form.hidden_tag()}}

    {{ render_field(form.new_password)}}
    {{ render_field(form.confirm)}}

  <input type="submit" value="Ändern">

  {% if form.errors %}
  <div class="row">
    <div class="col-6">
      {{ form.errors }}
    </div>
  </div>
{% endif %}

{% endblock %}
