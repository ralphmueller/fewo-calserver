{% extends 'layout.html' %}

{% from "_macros.html" import render_field %}

{% block content %}

<form method="post" action="{{ url_for('auth_bp.register') }}">

  {{ form.hidden_tag()}}

  <dl>
    {{ render_field(form.user)}}
    {{ render_field(form.password)}}
  </dl>

  <input type="submit" value="Anlegen">

  {% if form.errors %}
  <div class="row">
    <div class="col-6">
      {{ form.errors }}
    </div>
  </div>
{% endif %}

{% endblock %}
