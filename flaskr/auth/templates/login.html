{% extends 'layout.html' %}

{% from "_macros.html" import render_field %}

{% block content %}
  <form method="post" action="{{ url_for('auth_bp.login') }}">

    {{ form.csrf_token }}

    <dl>
      {{ render_field(form.user)}}
      {{ render_field(form.password)}}
    </dl>

    <input type="submit" value="Log In">

  </form>
{% endblock %}
