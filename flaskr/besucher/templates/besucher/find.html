{% extends "layout.html" %}

{% block content %}

<div class="row g-3">
    <div class="col-md-12">
        <div class="form-group">
            <input type="text"
                   name="q"
                   class="form-control"
                   placeholder="Anfangsbuchstaben Nachname"
                   hx-get="{{ url_for('besucher_bp.search') }}"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#results"
                   autocomplete="off">
        </div>
        <div id="results"></div>
        <p class="mt-2 text-muted small">
            Mindestens 3 Zeichen eintippen.<br>
            <code>*Müller</code> → endet auf Müller &nbsp;|&nbsp;
            <code>Müller*</code> → beginnt mit Müller &nbsp;|&nbsp;
            <code>*Müller*</code> → enthält Müller
        </p>
    </div>
</div>

{% endblock %}
