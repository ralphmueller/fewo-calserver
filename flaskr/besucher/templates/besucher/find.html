{% extends "layout.html" %}

{% block content %}

<div class="row g-3">
    <div class="col-md-12">
        <div class="form-group">
            <input type="text"
                   name="q"
                   class="form-control"
                   placeholder="Anfangsbuchstaben Nachname"
                   hx-get="{{ url_for('besucher_bp.search') }}"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#results"
                   autocomplete="off">
        </div>
        <div id="results"></div>
        <div id="detail-panel" class="mt-3"></div>
        <p class="mt-2 text-muted small">
            Mindestens 3 Zeichen eintippen. &nbsp;<code>*</code> als Wildcard.<br>
            <code>Müller</code> → exakt &nbsp;|&nbsp;
            <code>Müll*</code> → beginnt mit &nbsp;|&nbsp;
            <code>*müller*</code> → enthält<br>
            <code>Müll* Ral*</code> → Nachname + Vorname kombiniert
        </p>
    </div>
</div>

{% endblock %}
